name: Go Submodule CI - app-scanner

on:
  push:
    branches: [main] # Or your default branch
  pull_request:
    branches: [main] # Or your default branch

env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-scanner
        uses: actions/checkout@v4
        with:
          path: app-scanner

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: app-scanner/go.sum

      # gopacket/pcap requires CGO and libpcap headers to compile, otherwise
      # both `go test` and golangci-lint fail to load the package.
      - name: Install libpcap (required by gopacket)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Dependencies
        working-directory: app-scanner
        run: |
          go mod download
          git diff --exit-code -- go.mod go.sum
          go list -m github.com/SiriusScan/pingpp

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # v1.63 is built against Go 1.23; bump to v1.64.8 which supports
          # the Go 1.24 toolchain this module targets.
          version: v1.64.8
          args: --timeout=5m
          working-directory: app-scanner
          # The repo carries a pre-existing lint baseline across many files
          # that was never enforced (CI was broken). Only fail on issues
          # newly introduced by the current branch/PR; cleaning up the
          # baseline is tracked separately.
          only-new-issues: true

      - name: Test
        working-directory: app-scanner
        # -short skips integration tests that require live targets or the
        # /sirius-nse manifest fixture (only present inside the engine
        # container). All unit tests still run.
        run: go test -v -race -short ./...

      - name: Send repository_dispatch to Sirius main repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MAIN_REPO_ACCESS_TOKEN }}
          repository: SiriusScan/Sirius
          event-type: submodule-update
          client-payload: '{ "submodule": "${{ github.repository }}", "commit_sha": "${{ github.sha }}", "ref": "${{ github.ref }}", "engine_promotion": "source-pin-v1" }'
